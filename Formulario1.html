<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplod e Formulario</title>
    <style>
        body{
            background-color: lightskyblue;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 22px;
            text-align: justify;
        }
        h1{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 35px;
            color: blue;
            text-align: center;
        }
        form{
            margin-left: 100px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulários 1</h1>
    <form action="" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <table>
                <tr>
        <td><label for="nomep">Nome:</label></td>
        <td><input type="text" name="nomep" maxlength="100" size="100"></td>
        <tr>
        <td><label for="morada">Morada:</label></td>
        <td><input type="text" name="morada" maxlength="150" size="150" required></td>
        <tr>
        <td><label for="email">Email: </label></td>
        <td><input type="email" name="email" size="50" required></td>
        <td><label for="telemovel">Telemóvel: </label></td>
        <input type="number" name="telemovel" required>
        <label for="datanasc">Data de Nascimento: </label>
        <input type="date" name="datanasc">
        </table>
        </fieldset>
        <fieldset>
            <legend>Dados Complementares</legend>
            <label for="estado">Estado civil:</label>
            <input type="radio" name="estado" value="S">Solteiro
            <input type="radio" name="estado" value="C">Casado
            <input type="radio" name="estado" value="V">Viúvo
            <input type="radio" name="estado" value="D">Divorciado<br>
            <label for="regiao">Região</label>
            <select name="regiao" id="regiao">
                <option value="1">Norte</option>
                <option value="2">Centro</option>
                <option value="3">Sul</option>
            </select><br>
            <label for="desporto">Desportos Favoritos:</label>
            <input type="checkbox" id="desporto1" value="1">Futebol
            <input type="checkbox" id="desporto2" value="1">Voleivol
            <input type="checkbox" id="desporto3" value="1" checked>Padel
            <input type="checkbox" id="desporto4" value="1">Andebol



        </fieldset>
        <center><input type="submit" value="Submeter formulário"></center>

    </form>
</body>
</html>
